name: build

# The push filter keeps every commit of a Sapling stack from building: only main is pushed as a
# branch. The daily sheds job pushes to main too, so the two paths it writes are ignored — nothing
# here reads either artifact, and a push carrying only those bytes has nothing to lint or test.
# `paths-ignore` is on the push trigger alone: a PR that touches them is a person changing the
# pipeline, and builds.
on:
  push:
    branches: [main]
    paths-ignore: ["public/sheds/**", "public/ferry-schedule/**"]
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pointers on every path, the deploy included: the objects under data/ are the sole draw on the
      # account's monthly LFS bandwidth, and the deploy gets them from the cache below instead. lint
      # and tests read nothing under data/ at all.
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: oven-sh/setup-bun@v2
      # Pinned to match rust-toolchain.toml — see the comment there. Move both together.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun lint
      # scripts too: the build-time invariants live there, and a city that breaks one should
      # fail here rather than halfway through an ingest.
      - run: bun test src scripts
      # The committed shed artifact records what the durable key space of its graph was built from,
      # and this compares that against the same in this checkout — so a change that lands without a
      # `bun run build-sheds` fails here rather than one deploy later. It reads data/** only as the
      # LFS POINTER text, whose oid is the object's own sha256, so it needs no LFS objects and this
      # job's `lfs: false` stays as it is. Both halves are the tiler's — `tiler graph-inputs` over
      # the plan's sources decision, and `tiler key-probe` over a 268 KB committed fixture — so this
      # is a debug build of the crate (the clippy run above is check-only, so this is the job's one
      # codegen build; rust-cache keeps it) and under a second to run.
      # scripts/graph-inputs.ts reads their reports, scripts/README.md has why the set is that set.
      - run: bun run check-shed-inputs
      # The DEM the elevation pass and the relief bake sample: 651 tiles, 1.6 GB, fetched inside
      # `bun export` (write-plan resolves the mosaic, so this is not an ingest-time cost) and kept
      # under .cache/ by name. Upstream publishes a collection once and leaves it, so the key only has
      # to move when the collection does — which is the URL in scripts/elevation.ts.
      - if: inputs.upload-pages
        uses: actions/cache@v6
        with:
          path: .cache/werk-*.bin
          key: dem-${{ hashFiles('scripts/elevation.ts', 'src/tree-cover/manifest.json') }}
          restore-keys: |
            dem-
      # The LFS objects for data/**, 168 MB, restored rather than downloaded. An LFS pointer's text
      # carries the object's own sha256, and the checkout above leaves the pointers in place, so
      # hashing them here keys this on the content itself. `git lfs pull` then smudges the working
      # tree, fetching only what the cache missed. It runs after check-shed-inputs, which wants the
      # pointer text, and before the tile cache, whose key has always hashed the real bytes.
      - if: inputs.upload-pages
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('data/**') }}
      - if: inputs.upload-pages
        run: git lfs pull

      # The tile render + static export is expensive (the shade pyramid alone is ~20 min) and its
      # output is only consumed by the Pages deploy, so it runs only on that path. A push or PR stops
      # at lint + tests.
      - if: inputs.upload-pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next
      - if: inputs.upload-pages
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
      # The derived tiles/graph (public/**), keyed on the tiler's inputs. On a hit, `tiler build`'s
      # content-hash freshness check recognizes them as current and skips the ~20-min render; on a miss
      # (any data/tiler/script change) it rebuilds and this saves the new set. The freshness check is the
      # correctness net, so the key only needs to be a good hit heuristic, not exhaustive.
      - if: inputs.upload-pages
        uses: actions/cache@v6
        with:
          path: |
            public/tiles
            public/casters
            public/routing
            public/streets
            public/commercial
            public/commercial-lines
            public/trees
            public/landmarks
            public/art
            public/ferries
            public/highways
            public/dining
            public/openstreets
            public/landuse
          key: tiles-${{ hashFiles('data/**', 'crates/tiler/**', 'scripts/*.ts', 'src/tree-cover/manifest.json', 'src/tree-cover/ramp.ts', 'src/tree-cover/genus.ts', 'src/shade/sun.ts', 'Cargo.toml', 'Cargo.lock') }}
      - if: inputs.upload-pages
        run: bun export
      # The committed shed artifact names the graph it was placed against and the client resolves
      # nothing against any other one, so a deploy whose graph inputs moved without a `build-sheds`
      # re-place in the same push makes every shed on the map vanish rather than misplacing one —
      # correct, and invisible until someone looks. This is the last step that holds both halves, the
      # graph having only just been built, so the pairing is blocked here instead of being remembered.
      - if: inputs.upload-pages
        run: bun run check-sheds
      # The route-level checks (tests/route-sampling.test.ts) cannot run with lint and tests above:
      # they read the graph this build just made, which is gitignored, and two LFS files under data/
      # that the non-deploy checkout deliberately takes as pointers. This is the one path with both,
      # and the graph is as fresh as it gets here. ~13 s.
      - if: inputs.upload-pages
        run: bun run test-routes
      - if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
