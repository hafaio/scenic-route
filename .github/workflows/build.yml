name: build

# The push filter keeps every commit of a Sapling stack from building: only main is pushed as a
# branch. The daily sheds job pushes to main too, so its one path is ignored — nothing here reads the
# artifact, and a push carrying only those bytes has nothing to lint or test. `paths-ignore` is on
# the push trigger alone: a PR that touches them is a person changing the pipeline, and builds.
on:
  push:
    branches: [main]
    paths-ignore: ["public/sheds/**"]
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # LFS checkout is off except on the deploy path: the large blobs under data/ are only needed to
      # build the map, and downloads are the sole draw on the account's monthly LFS bandwidth. lint
      # and tests read nothing under data/, so they take the pointers.
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.upload-pages == true }}
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun test src
      # The tile render + static export is expensive (the shade pyramid alone is ~20 min) and its
      # output is only consumed by the Pages deploy, so it runs only on that path. A push or PR stops
      # at lint + tests.
      - if: inputs.upload-pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next
      - if: inputs.upload-pages
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
      # The derived tiles/graph (public/**), keyed on the tiler's inputs. On a hit, build-street-tiles'
      # content-hash freshness check recognizes them as current and skips the ~20-min render; on a miss
      # (any data/tiler/script change) it rebuilds and this saves the new set. The freshness check is the
      # correctness net, so the key only needs to be a good hit heuristic, not exhaustive.
      - if: inputs.upload-pages
        uses: actions/cache@v6
        with:
          path: |
            public/tiles
            public/casters
            public/routing
            public/streets
            public/commercial
            public/commercial-lines
            public/trees
            public/landmarks
            public/art
            public/ferries
            public/highways
            public/dining
            public/openstreets
            public/landuse
          key: tiles-${{ hashFiles('data/**', 'crates/tiler/**', 'scripts/*.ts', 'src/tree-cover/manifest.json', 'src/tree-cover/ramp.ts', 'src/tree-cover/genus.ts', 'Cargo.toml', 'Cargo.lock') }}
      - if: inputs.upload-pages
        run: bun export
      # The route-level checks (tests/route-sampling.test.ts) cannot run with lint and tests above:
      # they read the graph this build just made, which is gitignored, and two LFS files under data/
      # that the non-deploy checkout deliberately takes as pointers. This is the one path with both,
      # and the graph is as fresh as it gets here. ~13 s.
      - if: inputs.upload-pages
        run: bun run test-routes
      - if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
