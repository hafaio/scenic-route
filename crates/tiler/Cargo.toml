[package]
name = "tiler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cavalier_contours = "0.7"
rand = { version = "0.9", default-features = false }
rand_chacha = "0.9"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# lzw is NYC's canopy height model; zstd is the 3DEP COGs SF's crown heights and elevation come from
tiff = { version = "0.10", default-features = false, features = ["lzw", "zstd"] }
webp = { version = "0.3", default-features = false }
