[package]
name = "tiler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cavalier_contours = "0.9"
clap = { version = "4.6.6", features = ["derive"] }
# the 3DEP point cloud the East Bay's building heights are binned from: LAS 1.4 records
# inside laszip nodes, which is what the "laz" feature decodes
las = { version = "0.11", default-features = false, features = ["laz"] }
# not a proc macro here: the code epoch hashes each module's TOKEN stream, so a comment or a
# reformat leaves every pass's stamp where it was — see Plan::hash_source_tokens
proc-macro2 = "1.0"
rand = { version = "0.9", default-features = false }
rand_chacha = "0.10"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# the graph-inputs stamp: sha256 because a Git LFS pointer's oid IS the object's sha256, which is
# what lets a checkout holding only pointers stamp what one holding the blobs does
sha2 = "0.11.0"
# lzw is NYC's canopy height model; zstd is the 3DEP COGs SF's crown heights and elevation come from
tiff = { version = "0.10", default-features = false, features = ["lzw", "zstd"] }
webp = { version = "0.3", default-features = false }
